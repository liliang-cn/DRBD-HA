[[promoter]]

[promoter.resources.redis-data]
start = [
  "var-lib-redis.mount",
  "ocf:heartbeat:IPaddr2 redis-data_vip cidr_netmask=24 ip=192.168.123.197 nic=eth0",
  "redis-server.service",
