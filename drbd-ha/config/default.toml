# DRBD HA Manager Configuration

[server]
# Host to bind to
host = "0.0.0.0"
# Port to listen on
port = 3373

[ssh]
# Connection timeout in seconds
connection_timeout_secs = 30
# Command execution timeout in seconds
command_timeout_secs = 60
# Maximum connections per host
max_connections_per_host = 5
# Default SSH port
default_port = 22
# Optional default SSH username for managed nodes.
# If unset, drbd-ha first tries the current login user and falls back to root.
# default_user = "cluster-admin"

[drbd]
# Path to DRBD resource configuration directory
config_path = "/etc/drbd.d"
# Path to drbd-reactor configuration directory
reactor_config_path = "/etc/drbd-reactor.d"
# Path to systemd unit files directory
systemd_unit_path = "/etc/systemd/system"

[controller]
# external: recommended default; drbd-ha runs outside the cluster and executes cluster operations over SSH
# embedded: opt-in mode when drbd-ha itself runs on a managed cluster node
mode = "external"
# Optional advanced override for external mode.
# If unset, drbd-ha automatically selects a managed node from the node list.
# Optional SSH overrides for the explicit proxy_host above.
# proxy_host = "gui01"
# proxy_port = 22
# proxy_user = "cluster-admin"

[auth]
# Whether authentication is enabled
enabled = false
# API token (required if enabled = true)
# token = "your-secret-token-here"

[log]
# Log level: trace, debug, info, warn, error
level = "info"
# Log file path (optional, if not set logs to stdout/journal only)
file = "/var/log/drbd-ha/drbd-ha.log"
