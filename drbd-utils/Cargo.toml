[package]
name = "drbd-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
shell-cmd = { path = "../shell-cmd" }
tracing = "0.1"
tokio = { version = "1.0", features = ["time"] }
tera = "1"

[dev-dependencies]
serial_test = "3"