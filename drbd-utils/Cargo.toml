[package]
name = "drbd-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
dispatch-rs = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
shell-cmd = { path = "../shell-cmd" }
tracing = "0.1"
tokio = { version = "1.50", features = ["time"] }
config-gen = { path = "../config-gen" }
utoipa = { version = "5.4.0", features = ["chrono"], optional = true }

[features]
default = []
openapi = ["utoipa"]

[dev-dependencies]
serial_test = "3"
