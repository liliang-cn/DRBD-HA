[package]
name = "drbd-reactor-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
dispatch-rs = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.50", features = ["process", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
gethostname = "1.1"
config-gen = { path = "../config-gen" }
