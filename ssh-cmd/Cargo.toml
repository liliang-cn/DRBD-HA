[package]
name = "ssh-cmd"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["process", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dispatch-rs = "0.3"

[dev-dependencies]
serial_test = "3"