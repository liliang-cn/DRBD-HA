[package]
name = "zfs-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
dispatch-rs = "0.3"
dispatch-config = { path = "../dispatch-config" }
tokio = { version = "1", features = ["process", "fs", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
ssh-cmd = { path = "../ssh-cmd" }
shlex = "1"

[dev-dependencies]
serial_test = "3"