[package]
name = "ra-params"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
dispatch-rs = "0.3"
dispatch-config = { path = "../dispatch-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.40", features = ["serialize"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
