name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  ui:
    name: UI (biome, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drbd-ha/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: drbd-ha/ui/package-lock.json
      - name: install
        run: npm ci
      - name: lint (biome)
        run: npm run lint
      - name: typecheck (tsc)
        run: npm run typecheck
      - name: build
        run: npm run build
