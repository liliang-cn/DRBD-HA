[package]
name = "drbd-migration"
version = "0.1.0"
edition = "2021"
description = "Data migration engine for DRBD HA"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
shell-cmd = { path = "../shell-cmd" }
systemd-utils = { path = "../systemd-utils" }
