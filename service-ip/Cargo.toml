[package]
name = "service-ip"
version = "1.0.0"
edition = "2021"

[dependencies]
# 异步运行时，工业标准
tokio = { version = "1", features = ["full"] }
# 命令行参数解析
clap = { version = "4", features = ["derive"] }
# 错误处理
anyhow = "1.0"
# 日志
log = "0.4"
env_logger = "0.10"
# IP/CIDR 解析
ipnetwork = "0.20"
# 内核 Netlink 通信 (替代 ip 命令)
rtnetlink = "0.13"
netlink-packet-route = "0.17"
futures = "0.3"
# 底层网络包构造 (替代 arping)
pnet = "0.34"
