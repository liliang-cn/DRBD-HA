[package]
name = "service-ip"
version = "1.0.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
# Error handling
anyhow = "1.0"
# Logging
log = "0.4"
env_logger = "0.10"
# IP/CIDR parsing
ipnetwork = "0.20"
# Netlink communication (replaces 'ip' command)
rtnetlink = "0.13"
netlink-packet-route = "0.17"
futures = "0.3"
# Low-level packet construction (replaces 'arping')
pnet = "0.34"